<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention budget</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1c1b19; --muted:#6b675f; --line:#e2ddd2;
  --accent:#2f5bd3; --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fbf0dc;
  --bad:#b3261e; --bad-bg:#fbe6e4; --info-bg:#e8eefc; --code:#f1eee6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --paper:#1d1d1a; --ink:#ece9e1; --muted:#a19c91; --line:#34322d;
    --accent:#7c9cff; --ok:#5fd19a; --ok-bg:#16301f; --warn:#f0b45a; --warn-bg:#33270f;
    --bad:#ff8a80; --bad-bg:#3a1714; --info-bg:#1b2440; --code:#262521;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --paper:#1d1d1a; --ink:#ece9e1; --muted:#a19c91; --line:#34322d;
  --accent:#7c9cff; --ok:#5fd19a; --ok-bg:#16301f; --warn:#f0b45a; --warn-bg:#33270f;
  --bad:#ff8a80; --bad-bg:#3a1714; --info-bg:#1b2440; --code:#262521;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:32px 0 12px}
.muted{color:var(--muted)}
.req{margin:16px 0 4px;font-size:16px}
.req a{color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.pill{display:inline-block;font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-mute{background:var(--code);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{font:600 14px var(--sans);border:0;background:transparent;color:var(--ink);padding:9px 18px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{height:10px;border-radius:999px;background:var(--code);overflow:hidden;margin:12px 0 4px;display:flex}
.bar span{display:block;height:100%}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item .p{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.item .w{font-size:13px;color:var(--muted)}
.item.out{opacity:.55}
.item.out .p{text-decoration:line-through;text-decoration-color:var(--muted)}
details summary{cursor:pointer;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.note{border-left:4px solid var(--warn);}
.theme{font:12px var(--sans);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<script id="budget" type="application/json">/*BUDGET_JSON*/</script>
<div class="wrap">
  <header>
    <h1>Attention budget <small id="sub"></small></h1>
    <button class="theme" id="theme" type="button">Theme</button>
  </header>
  <p class="req" id="req"></p>
  <p class="muted">Machines clear what they can re-execute. Human minutes go only to what no machine can give a receipt for. Whatever doesn't fit your budget is listed as <b>knowingly unread</b>, never hidden.</p>

  <div class="stats" id="stats"></div>

  <div id="ledger"></div>

  <h2>How much time do you have?</h2>
  <div class="card">
    <div class="seg" role="group" aria-label="Review budget" id="seg"></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="muted" id="fit"></div>
    <div id="human" style="margin-top:8px"></div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0" id="assume"></p>
  </div>

  <h2>Cleared by machine, with receipts</h2>
  <div id="machine"></div>
</div>
<script>
const B = JSON.parse(document.getElementById('budget').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = B.totals;

$('sub').textContent = `${B.requirement.id} · ${B.base.slice(0,8)}..${B.head}`;
$('req').innerHTML = `Requirement <a href="${esc(B.requirement.url)}">${esc(B.requirement.id)}</a>: ${esc(B.requirement.title)}`;
$('stats').innerHTML = [
  [T.files, 'files changed'],
  [T.machine_cleared, 'cleared by machine (executed check)'],
  [T.human, 'need a human'],
  [`${T.naive_minutes} → ${T.human_minutes}`, 'minutes to read (estimate)'],
].map(([n,l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
$('assume').textContent = `Estimate: ${B.assumptions.read_rate_lines_per_min} changed lines per minute, at least ${B.assumptions.min_minutes_per_file} min per file. Order: hand-written source, then templates, then tests, then docs.`;

const VERD = {
  'broken-by-pr': ['p-bad', 'Passes on base, fails on the PR: proven regression'],
  'catching': ['p-ok', 'Fails on base, passes on the PR: proven change'],
  'failing-both': ['p-warn', 'Fails before and after: requirement not met here'],
  'placebo': ['p-mute', 'Passes before and after: proves nothing about the PR (fact check)'],
};
if (B.ledger) {
  const order = ['broken-by-pr', 'failing-both', 'catching', 'placebo'];
  const es = [...B.ledger.entries].sort((a, b) => order.indexOf(a.verdict) - order.indexOf(b.verdict));
  $('ledger').innerHTML = `<h2>Read these first: executed base vs PR</h2><div class="card">` + es.map(e => {
    const [cls, what] = VERD[e.verdict] || ['p-mute', e.verdict];
    return `<div class="item" style="grid-template-columns:auto 1fr"><div><span class="pill ${cls}">${esc(e.verdict)}</span></div>
      <div><div class="p">${esc(e.test)}</div><div class="w">${esc(what)}</div></div></div>`;
  }).join('') + `<p class="muted" style="font-size:12.5px;margin:10px 0 0">Tests prefixed <span class="mono">Et</span> were written by the reviewer, not the author agent. These cost no reading minutes: each one is a yes/no question with an executed answer.</p></div>`;
}

const budgets = [2, 10, 60];
let current = 10;
try { current = +localStorage.getItem('et-budget') || 10; } catch (e) {}
$('seg').innerHTML = budgets.map(b => `<button type="button" data-b="${b}">${b} min</button>`).join('');
$('seg').addEventListener('click', e => { const b = e.target.dataset.b; if (b) { current = +b; try { localStorage.setItem('et-budget', b); } catch (e) {} render(); } });

function render() {
  for (const b of $('seg').children) b.setAttribute('aria-pressed', String(+b.dataset.b === current));
  const read = B.human.filter(i => i.cumulative_minutes <= current);
  const unread = B.human.filter(i => i.cumulative_minutes > current);
  const usedMin = read.length ? read[read.length - 1].cumulative_minutes : 0;
  const pct = n => (100 * n / T.files) + '%';
  $('bar').innerHTML = `<span style="width:${pct(T.machine_cleared)};background:var(--ok)"></span>`
    + `<span style="width:${pct(read.length)};background:var(--accent)"></span>`
    + `<span style="width:${pct(unread.length)};background:var(--warn)"></span>`;
  $('fit').innerHTML = unread.length
    ? `In ${current} min you read <b>${read.length}</b> of ${T.human} files (${usedMin} min). <b>${unread.length}</b> ${unread.length === 1 ? 'stays' : 'stay'} unread; the record names ${unread.length === 1 ? 'it' : 'them'}.`
    : `In ${current} min you read all <b>${T.human}</b> human files (${T.human_minutes} min). The other ${T.machine_cleared} have receipts.`;
  $('human').innerHTML = B.human.map(i => {
    const out = i.cumulative_minutes > current;
    return `<div class="item${out ? ' out' : ''}">
      <div class="t">${i.cumulative_minutes} min</div>
      <div><div class="p">${esc(i.path)}</div><div class="w">${esc(i.why)} · +${i.added}/−${i.deleted}</div></div>
      <div>${out ? '<span class="pill p-warn">unread</span>' : '<span class="pill p-mute">read</span>'}</div>
    </div>`;
  }).join('');
}
render();

const groups = {};
for (const m of B.machine) (groups[m.cls] ||= []).push(m);
const regen = B.regen || {};
const titles = {
  generated: ['Regenerated snapshots', `Reset to base bytes, regenerated by the PR's own generator, compared by git blob id. ${regen.counts ? Object.entries(regen.counts).map(([k,v]) => `${k}: ${v}`).join(', ') : ''}`],
  'template-output': ['T4 template outputs', 'Every line the PR added to the .tt appears in the committed .cs output the same number of times. String-level check, not a re-run of the T4 engine.'],
};
$('machine').innerHTML = Object.entries(groups).map(([cls, items]) => {
  const [t, how] = titles[cls] || [cls, ''];
  const rows = items.map(i => `<tr><td class="mono">${esc(i.path)}</td><td class="mono">${esc(i.receipt)}</td></tr>`).join('');
  return `<div class="card"><div><span class="pill p-ok">${items.length} cleared</span> <b>${esc(t)}</b></div>
    <p class="muted" style="margin:6px 0">${esc(how)}</p>
    <details><summary>Show all ${items.length} receipts</summary><table><tr><th>File</th><th>Receipt</th></tr>${rows}</table></details></div>`;
}).join('') + (B.regen && B.regen.method ? `<div class="card note"><b>Method</b><p class="muted mono" style="margin:6px 0">${esc(B.regen.method)}</p>
  <p class="muted" style="margin:0">Negative control: appending one line to a snapshot makes its test fail in a normal build, so these snapshot files really are checked byte for byte.</p></div>` : '');

$('theme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});
</script>
</body>
</html>
