[project]
name = "earned-trust"
version = "0.1.0"
description = "Reference implementation: AI proves behavior changes, the named human predicts before reveal, mismatches are the review."
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.4",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
et = "earned_trust.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earned_trust"]
